/velocity_smoother:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    autostart_node: false
    bond_heartbeat_period: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    enable_stamped_cmd_vel: true
    feedback: OPEN_LOOP
    max_accel:
    - 0.8
    - 0.0
    - 1.5
    max_decel:
    - -0.8
    - 0.0
    - -1.5
    max_velocity:
    - 1.0
    - 0.0
    - 1.2
    min_velocity:
    - -1.0
    - 0.0
    - -1.2
    odom_duration: 0.1
    odom_topic: odom
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
    scale_velocities: false
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: true
    start_type_description_service: true
    use_realtime_priority: false
    use_sim_time: true
    velocity_timeout: 1.0

