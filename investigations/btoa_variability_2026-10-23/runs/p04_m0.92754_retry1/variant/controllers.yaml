controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController


diff_drive_controller:
  ros__parameters:
    use_sim_time: true

    left_wheel_names:
      - left_wheel_joint

    right_wheel_names:
      - right_wheel_joint

    # Current V0 geometry
    wheel_separation: 0.69
    wheel_radius: 0.10

    wheel_separation_multiplier: 0.92754
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0

    odom_frame_id: odom
    base_frame_id: base_footprint

    # EKF will publish odom -> base_footprint
    enable_odom_tf: false

    open_loop: false
    position_feedback: true

    cmd_vel_timeout: 0.5
    publish_limited_velocity: true

    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: 0.8
    linear.x.max_jerk: .NAN
    linear.x.min_jerk: .NAN

    angular.z.max_velocity: 1.2
    angular.z.min_velocity: -1.2
    angular.z.max_acceleration: 1.5
    angular.z.min_acceleration: -1.5
    angular.z.max_jerk: .NAN
    angular.z.min_jerk: .NAN