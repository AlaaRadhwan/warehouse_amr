amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 20.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 180
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"

    set_initial_pose: false
    always_reset_initial_pose: false

    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
    - compute_path_error_code
    - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"

      required_movement_radius: 0.10
      required_movement_angle: 0.10

      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      plugin: "nav2_controller::StoppedGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.20

      # Goal is reached only once the robot is also (nearly) stopped.
      trans_stopped_velocity: 0.05
      rot_stopped_velocity: 0.10

      # Re-evaluate position and yaw together on every check.
      stateful: false

      # Goal yaw is meaningful (station orientation): do not accept
      # a goal heading rotated by pi.
      symmetric_yaw_tolerance: false

    FollowPath:
      # Rotation Shim wrapping MPPI (nav2_rotation_shim_controller 1.3.12). The shim configures the primary
      # controller under this SAME plugin name, so every MPPI parameter below stays under FollowPath.* unchanged.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"

      # =====================================================
      # ROTATION SHIM
      # =====================================================

      # Rotate in place to the path heading before tracking starts / when a new goal arrives:
      # engage above 45 deg, release below 22.5 deg (hysteresis). Defaults, stated explicitly.
      angular_dist_threshold: 0.785
      angular_disengage_threshold: 0.3925

      # Path point (>= this far from the path start) whose orientation is the "rough path heading".
      forward_sampling_distance: 0.5

      # Compare the robot yaw with the path-point ORIENTATION (State Lattice poses carry the vehicle heading,
      # also on reverse segments) instead of the bearing to the point, so reverse segments need no 180 deg turn.
      use_path_orientations: true

      # Pre-path rotation only for a new goal or while already rotating; ordinary 1 Hz replans do not re-trigger it.
      rotate_to_heading_once: true

      # Inside the goal's XY tolerance (taken from the goal checker, 0.25 m) rotate to the final path pose
      # heading, i.e. the requested goal yaw (snapped to the nearest lattice heading bin by the planner).
      rotate_to_goal_heading: true

      # Rotation-rate profile limited from the measured feedback velocity, not from the previous command.
      closed_loop: true

      # In-place rotation limits, chosen from existing robot constraints:
      #   rate  0.8 rad/s = 80 % of MPPI wz_max (1.0): keeps the commanded rate off the limit that was pinned in the
      #                     e01 spin (measured 1.079 rad/s at a 1.0 command in the uncalibrated plant).
      #   accel 1.0 rad/s^2 = MPPI az_max; below the velocity smoother's 1.5 rad/s^2 so the shim's own
      #                     stopping profile, not the smoother, shapes the motion.
      rotate_to_heading_angular_vel: 0.8
      max_angular_accel: 1.0

      # Look-ahead for the in-place rotation collision check (footprint swept at the commanded rate).
      simulate_ahead_time: 1.0

      # =====================================================
      # MPPI (primary controller): unchanged baseline below
      # =====================================================

      # =====================================================
      # MODEL / OPTIMIZER
      # =====================================================

      motion_model: "DiffDrive"

      # controller_server = 20 Hz
      model_dt: 0.05

      # 2.8 second prediction horizon
      time_steps: 56

      batch_size: 2000
      iteration_count: 1

      temperature: 0.3
      gamma: 0.015

      retry_attempt_limit: 1
      regenerate_noises: false
      open_loop: false

      visualize: true


      # =====================================================
      # VEHICLE LIMITS
      # =====================================================

      vx_max: 0.8

      # Bidirectional baseline: reverse limited to 0.35 m/s.
      vx_min: -0.35

      # Differential drive
      vy_max: 0.0

      wz_max: 1.0

      ax_max: 0.8
      ax_min: -0.8

      ay_max: 0.0
      ay_min: 0.0

      az_max: 1.0


      # =====================================================
      # SAMPLING
      # =====================================================

      vx_std: 0.20
      vy_std: 0.0
      wz_std: 0.40


      # =====================================================
      # PATH HANDLING
      # =====================================================

      transform_tolerance: 0.1

      # Maximum nominal travel over the prediction horizon:
      # 0.8 * 2.8 ~= 2.24 m
      prune_distance: 2.5

      # Paths may contain direction changes (cusps). Track only up to
      # the cusp, then continue once the robot is close enough to it.
      enforce_path_inversion: true

      # Tolerances for "cusp reached" (Jazzy defaults: 0.2 m / 0.4 rad,
      # too loose for short maneuvers). Approved values.
      inversion_xy_tolerance: 0.15
      inversion_yaw_tolerance: 0.30


      # =====================================================
      # CRITICS
      # =====================================================

      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"


      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0


      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81

        critical_cost: 300.0

        # Use the actual rectangular AMR footprint.
        consider_footprint: true

        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2


      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4


      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

        # Opposite headings are not equivalent for
        # parking / loading / station poses.
        symmetric_yaw_tolerance: false


      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0

        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20

        # State Lattice yaw information is meaningful.
        use_path_orientations: true


      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 0.10


      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.2

        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.785398

        # 2 = consider feasible path orientations
        mode: 2

    enable_stamped_cmd_vel: true
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 7
      height: 7
      resolution: 0.05
      plugins:
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.70
      always_send_full_costmap: true

      footprint: '[[0.50, 0.37], [0.50, -0.37], [-0.50, -0.37], [-0.50, 0.37]]'
      footprint_padding: 0.0
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true

        max_obstacle_height: 2.0

        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true

          min_obstacle_height: 0.0
          max_obstacle_height: 2.0

          obstacle_min_range: 0.05
          obstacle_max_range: 8.0
          raytrace_min_range: 0.05
          raytrace_max_range: 10.0
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        max_obstacle_height: 2.0

        observation_sources: scan
        scan:
          topic: /scan
          clearing: true
          marking: true
          data_type: "LaserScan"

          min_obstacle_height: 0.0
          max_obstacle_height: 2.0

          raytrace_max_range: 10.0
          raytrace_min_range: 0.05
          obstacle_max_range: 8.0
          obstacle_min_range: 0.05
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
      always_send_full_costmap: true

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

      footprint: '[[0.50, 0.37], [0.50, -0.37], [-0.50, -0.37], [-0.50, 0.37]]'
      footprint_padding: 0.0
map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:

    expected_planner_frequency: 5.0
    costmap_update_timeout: 1.0

    planner_plugins:
      - "GridBased"

    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerLattice"

      # Rewritten by simulation_navigation.launch.py
      lattice_filepath: ""

      # ---------------------------------------------------
      # Goal / search
      # ---------------------------------------------------

      tolerance: 0.10
      allow_unknown: true

      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 2.0

      # ---------------------------------------------------
      # Motion cost
      # ---------------------------------------------------

      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      retrospective_penalty: 0.015

      # The differential-drive lattice contains explicit
      # rotate-in-place primitives. Penalize them enough that
      # the planner prefers smooth translational motion when
      # practical.
      rotation_penalty: 2.0

      # ---------------------------------------------------
      # Goal connection
      # ---------------------------------------------------

      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 2.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false

      lookup_table_size: 20.0

      # ---------------------------------------------------
      # Replanning / direction
      # ---------------------------------------------------

      cache_obstacle_heuristic: false

      # Bidirectional baseline: lattice primitives may be traversed
      # in reverse; reverse_penalty (above) still biases toward forward.
      allow_reverse_expansion: true

      # ---------------------------------------------------
      # Path output
      # ---------------------------------------------------

      smooth_path: true
      debug_visualizations: false

      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.2
    min_rotational_vel: 0.4
    rotational_acc_lim: 1.5

    enable_stamped_cmd_vel: true
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    # The graph_filepath does not need to be specified since it going to be set by defaults in launch.
    # If you'd rather set it in the yaml, remove the default "graph" value in the launch file(s).
    # file & provide full path to map below. If graph config or launch default is provided, it is used
    # graph_filepath: $(find-pkg-share nav2_route)/graphs/aws_graph.geojson
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: true
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity:
    - 1.0
    - 0.0
    - 1.2
    min_velocity:
    - -1.0
    - 0.0
    - -1.2
    max_accel:
    - 0.8
    - 0.0
    - 1.5
    max_decel:
    - -0.8
    - 0.0
    - -1.5
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

    enable_stamped_cmd_vel: true
collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: true

    enable_stamped_cmd_vel: true
    
docking_server:
  ros__parameters:

    # =====================================================
    # DOCKING SERVER
    # =====================================================

    enable_stamped_cmd_vel: true

    controller_frequency: 50.0

    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0

    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.10

    max_retries: 3

    # Smooth local frame used during the precision approach
    base_frame: "base_footprint"
    fixed_frame: "odom"

    # We approach the station driving forward
    dock_backwards: false

    # If already within this distance of the staging pose,
    # skip the normal Nav2 staging navigation.
    dock_prestaging_tolerance: 0.50


    # =====================================================
    # DOCK TYPE
    # =====================================================

    dock_plugins:
      - "load_station_dock"

    load_station_dock:

      plugin: "opennav_docking::SimpleNonChargingDock"

      # Robot is considered docked when its pose is within
      # 5 cm of the refined final dock pose.
      docking_threshold: 0.05


      # ---------------------------------------------------
      # STAGING
      # ---------------------------------------------------

      # Final dock pose for Station A:
      #
      #         AprilTag
      #             |
      #          0.75 m
      #             |
      #        final pose
      #             |
      #          0.70 m
      #             |
      #       staging pose
      #
      # staging_x_offset is relative to the final dock pose.
      staging_x_offset: -0.70
      staging_yaw_offset: 0.0


      # ---------------------------------------------------
      # APRILTAG REFINEMENT
      # ---------------------------------------------------

      use_external_detection_pose: true

      # Our dock_pose_publisher publishes:
      #
      #   /detected_dock_pose
      #
      # already converted from the raw floor AprilTag pose
      # into the desired final base_footprint pose.
      external_detection_timeout: 1.0

      # Therefore Nav2 must NOT apply an additional
      # tag-to-dock transform.
      external_detection_translation_x: 0.0
      external_detection_translation_y: 0.0

      external_detection_rotation_roll: 0.0
      external_detection_rotation_pitch: 0.0
      external_detection_rotation_yaw: 0.0

      # Low-pass filtering of external dock-pose measurements
      filter_coef: 0.10


      # ---------------------------------------------------
      # DOCK SUCCESS
      # ---------------------------------------------------

      # No physical contact / motor-stall detection for our
      # operator loading station.
      use_stall_detection: false

    # =====================================================
    # PRECISION DOCKING CONTROLLER
    # =====================================================

    controller:

      k_phi: 3.0
      k_delta: 2.0

      # Slow precision approach
      v_linear_min: 0.05
      v_linear_max: 0.15

      v_angular_max: 0.75

      # Begin reducing velocity near the dock
      slowdown_radius: 0.25


      # ---------------------------------------------------
      # COLLISION CHECKING
      # ---------------------------------------------------

      use_collision_detection: true

      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"

      transform_tolerance: 0.1

      projection_time: 1.0
      simulation_time_step: 0.1

      # IMPORTANT:
      #
      # Station A is NOT a contact dock.
      # We want collision checking all the way to the target.
      #
      # Nav2 recommends 0.0 when physical contact with the
      # dock is not intended.
      dock_collision_threshold: 0.0

loopback_simulator:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
