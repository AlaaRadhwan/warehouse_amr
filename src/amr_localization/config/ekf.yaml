ekf_filter_node:
  ros__parameters:

    use_sim_time: true

    frequency: 50.0
    sensor_timeout: 0.2

    two_d_mode: true

    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom


    # ---------------------------------------------------------
    # Differential-drive wheel odometry
    #
    # Variables:
    # x y z
    # roll pitch yaw
    # vx vy vz
    # vroll vpitch vyaw
    # ax ay az
    # ---------------------------------------------------------

    odom0: /diff_drive_controller/odom

    odom0_config:
      [false, false, false,
       false, false, false,
       true,  true,  false,
       false, false, true,
       false, false, false]

    odom0_differential: false
    odom0_relative: false


    # ---------------------------------------------------------
    # IMU
    # ---------------------------------------------------------

    imu0: /imu/data_raw

    imu0_config:
      [false, false, false,
       false, false, false,
       false, false, false,
       false, false, true,
       false, false, false]

    imu0_differential: false
    imu0_relative: false