# EXPERIMENTAL overlay: MPPI interpretation for paths that do NOT encode feasible
# vehicle heading / reverse information (NavFn paths; also Route Server paths evaluated
# for the 180-degree departure). Selected with  mppi_path_interpretation:=2d.
# Only these three keys change; critic weights, limits and tolerances are untouched.
controller_server:
  ros__parameters:
    FollowPath:
      enforce_path_inversion: false      # no intentional cusps are supplied
      PathAlignCritic:
        use_path_orientations: false     # path yaw is not a vehicle heading
      PathAngleCritic:
        mode: 0                          # forward preference
