# EXPERIMENTAL overlay (applied in addition to mppi_2d_paths.yaml when
# mppi_path_interpretation:=2d_prefer_forward): reverse stays ENABLED (vx_min -0.35 from the base
# file, restated here) and nav2_mppi_controller PreferForwardCritic is added as a soft penalty.
# Critic list = base list + PreferForwardCritic (lists are replaced by the merge, so it is spelled out).
# Other critic weights, horizon, limits and tolerances are untouched.
controller_server:
  ros__parameters:
    FollowPath:
      vx_min: -0.35
      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
