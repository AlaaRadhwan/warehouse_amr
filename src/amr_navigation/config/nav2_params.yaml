amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 20.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 180
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"

    set_initial_pose: false
    always_reset_initial_pose: false

    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
    - compute_path_error_code
    - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"

      required_movement_radius: 0.10
      required_movement_angle: 0.10

      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.05
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # Nominal speed for the AMR
      desired_linear_vel: 0.8

      # Adaptive lookahead
      lookahead_dist: 0.8
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.2
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true

      # Heading alignment for differential drive
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.45
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 1.0

      # Do not use reverse motion yet
      allow_reversing: false

      # Goal approach
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.8
      stateful: true

      # Curvature-based speed regulation
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15

      # Keep cost-based speed regulation off initially so we isolate
      # controller behavior from costmap tuning
      use_cost_regulated_linear_velocity_scaling: false

      # Collision checking inside RPP
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.2

      # Keep curvature calculation simple for the first test
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.8

      transform_tolerance: 0.1
      max_robot_pose_search_dist: 10.0

    enable_stamped_cmd_vel: true
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 7
      height: 7
      resolution: 0.05
      plugins:
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.70
      always_send_full_costmap: true

      footprint: '[[0.50, 0.37], [0.50, -0.37], [-0.50, -0.37], [-0.50, 0.37]]'
      footprint_padding: 0.0
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true

        max_obstacle_height: 2.0

        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true

          min_obstacle_height: 0.0
          max_obstacle_height: 2.0

          obstacle_min_range: 0.05
          obstacle_max_range: 8.0
          raytrace_min_range: 0.05
          raytrace_max_range: 10.0
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        max_obstacle_height: 2.0

        observation_sources: scan
        scan:
          topic: /scan
          clearing: true
          marking: true
          data_type: "LaserScan"

          min_obstacle_height: 0.0
          max_obstacle_height: 2.0

          raytrace_max_range: 10.0
          raytrace_min_range: 0.05
          obstacle_max_range: 8.0
          obstacle_min_range: 0.05
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
      always_send_full_costmap: true

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

      footprint: '[[0.50, 0.37], [0.50, -0.37], [-0.50, -0.37], [-0.50, 0.37]]'
      footprint_padding: 0.0
map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:

    expected_planner_frequency: 5.0
    costmap_update_timeout: 1.0

    planner_plugins:
      - "GridBased"

    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerLattice"

      # Rewritten by simulation_navigation.launch.py
      lattice_filepath: ""

      # ---------------------------------------------------
      # Goal / search
      # ---------------------------------------------------

      tolerance: 0.10
      allow_unknown: true

      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 2.0

      # ---------------------------------------------------
      # Motion cost
      # ---------------------------------------------------

      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      retrospective_penalty: 0.015

      # The differential-drive lattice contains explicit
      # rotate-in-place primitives. Penalize them enough that
      # the planner prefers smooth translational motion when
      # practical.
      rotation_penalty: 5.0

      # ---------------------------------------------------
      # Goal connection
      # ---------------------------------------------------

      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false

      lookup_table_size: 20.0

      # ---------------------------------------------------
      # Replanning / direction
      # ---------------------------------------------------

      cache_obstacle_heuristic: false

      # Keep normal navigation forward-first for now.
      # In-place rotation is still available.
      allow_reverse_expansion: false

      # ---------------------------------------------------
      # Path output
      # ---------------------------------------------------

      smooth_path: true
      debug_visualizations: false

      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.2
    min_rotational_vel: 0.4
    rotational_acc_lim: 1.5

    enable_stamped_cmd_vel: true
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    # The graph_filepath does not need to be specified since it going to be set by defaults in launch.
    # If you'd rather set it in the yaml, remove the default "graph" value in the launch file(s).
    # file & provide full path to map below. If graph config or launch default is provided, it is used
    # graph_filepath: $(find-pkg-share nav2_route)/graphs/aws_graph.geojson
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity:
    - 1.0
    - 0.0
    - 1.2
    min_velocity:
    - -1.0
    - 0.0
    - -1.2
    max_accel:
    - 0.8
    - 0.0
    - 1.5
    max_decel:
    - -0.8
    - 0.0
    - -1.5
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

    enable_stamped_cmd_vel: true
collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: true

    enable_stamped_cmd_vel: true
    
docking_server:
  ros__parameters:

    # =====================================================
    # DOCKING SERVER
    # =====================================================

    enable_stamped_cmd_vel: true

    controller_frequency: 50.0

    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0

    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.10

    max_retries: 3

    # Smooth local frame used during the precision approach
    base_frame: "base_footprint"
    fixed_frame: "odom"

    # We approach the station driving forward
    dock_backwards: false

    # If already within this distance of the staging pose,
    # skip the normal Nav2 staging navigation.
    dock_prestaging_tolerance: 0.50


    # =====================================================
    # DOCK TYPE
    # =====================================================

    dock_plugins:
      - "load_station_dock"

    load_station_dock:

      plugin: "opennav_docking::SimpleNonChargingDock"

      # Robot is considered docked when its pose is within
      # 5 cm of the refined final dock pose.
      docking_threshold: 0.05


      # ---------------------------------------------------
      # STAGING
      # ---------------------------------------------------

      # Final dock pose for Station A:
      #
      #         AprilTag
      #             |
      #          0.75 m
      #             |
      #        final pose
      #             |
      #          0.70 m
      #             |
      #       staging pose
      #
      # staging_x_offset is relative to the final dock pose.
      staging_x_offset: -0.70
      staging_yaw_offset: 0.0


      # ---------------------------------------------------
      # APRILTAG REFINEMENT
      # ---------------------------------------------------

      use_external_detection_pose: true

      # Our dock_pose_publisher publishes:
      #
      #   /detected_dock_pose
      #
      # already converted from the raw floor AprilTag pose
      # into the desired final base_footprint pose.
      external_detection_timeout: 1.0

      # Therefore Nav2 must NOT apply an additional
      # tag-to-dock transform.
      external_detection_translation_x: 0.0
      external_detection_translation_y: 0.0

      external_detection_rotation_roll: 0.0
      external_detection_rotation_pitch: 0.0
      external_detection_rotation_yaw: 0.0

      # Low-pass filtering of external dock-pose measurements
      filter_coef: 0.10


      # ---------------------------------------------------
      # DOCK SUCCESS
      # ---------------------------------------------------

      # No physical contact / motor-stall detection for our
      # operator loading station.
      use_stall_detection: false

    # =====================================================
    # PRECISION DOCKING CONTROLLER
    # =====================================================

    controller:

      k_phi: 3.0
      k_delta: 2.0

      # Slow precision approach
      v_linear_min: 0.05
      v_linear_max: 0.15

      v_angular_max: 0.75

      # Begin reducing velocity near the dock
      slowdown_radius: 0.25


      # ---------------------------------------------------
      # COLLISION CHECKING
      # ---------------------------------------------------

      use_collision_detection: true

      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"

      transform_tolerance: 0.1

      projection_time: 1.0
      simulation_time_step: 0.1

      # IMPORTANT:
      #
      # Station A is NOT a contact dock.
      # We want collision checking all the way to the target.
      #
      # Nav2 recommends 0.0 when physical contact with the
      # dock is not intended.
      dock_collision_threshold: 0.0

loopback_simulator:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
